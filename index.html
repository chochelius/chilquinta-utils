<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Glosas OSF v1.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .form-container {
            width: 100%;
            max-width: 720px;
        }
        #glosaGenerada {
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 0.92rem;
            background-color: #f8f9fa;
            text-transform: uppercase;
        }
        .campo-pendiente {
            border-color: #ea868f !important;
            background-color: #fffafa;
        }
        .campo-pendiente:focus {
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.15) !important;
        }
        .campo-completo {
            border-color: #198754 !important;
        }
        .campo-completo:focus {
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15) !important;
        }
        .shortcut-hint {
            font-size: 0.78rem;
        }
    </style>
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">

    <div class="form-container card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Generador de glosas OSF</h5>
            <span id="appVersion" class="badge bg-light text-primary fw-semibold">v1.3</span>
        </div>

        <div class="card-body p-4">
            <form id="glosaForm" autocomplete="off">
                <!-- 1. Filtro rápido y selección de tipo de glosa -->
                <div class="mb-2">
                    <label for="filtroGlosa" class="form-label fw-semibold mb-1">Buscar y seleccionar Tipo de Glosa</label>
                    <div class="input-group input-group-sm mb-2">
                        <span class="input-group-text bg-white">🔍</span>
                        <input type="text" id="filtroGlosa" class="form-control" placeholder="Filtrar glosa (ej: lectura, CNR, empalme, retiro, reposición, electro...)">
                        <button type="button" id="btnLimpiarFiltro" class="btn btn-outline-secondary" title="Limpiar búsqueda">✕</button>
                    </div>
                    <select id="tipoGlosa" class="form-select">
                        <optgroup label="1. Gestión de Interacción (GI)">
                            <option value="gi_estandar">A. GI Estándar (Atención General)</option>
                            <option value="gi_lectura">B. Ingreso de Lectura Aportada (PELAP - GI Cerrada)</option>
                            <option value="gi_financiacion">C. Ingreso de Financiación / Convenio de Deuda</option>
                            <option value="gi_anulacion_fin">D. Anulación de Financiación / Convenio</option>
                            <option value="gi_tramites_admin">E. Cambio de Dirección / Titular / Trámites Administrativos</option>
                            <option value="gi_regularizacion_retiro">F. Regularización de Retiros de Servicio (Retiro Definitivo)</option>
                            <option value="gi_ed_nuevo">G. Registro Electrodependiente NO Registrado (Provisorio)</option>
                            <option value="gi_ed_emergencia">H. Emergencia / Cliente Electrodependiente (GI Abierta)</option>
                            <option value="gi_ed_fallecido">I1. Electrodependiente — Paciente Fallecido</option>
                            <option value="gi_ed_domicilio">I2. Electrodependiente — Cambio de Domicilio</option>
                            <option value="gi_ed_alta">I3. Electrodependiente — Alta Médica / Ya no es ED</option>
                            <option value="gi_at_paso1">J1. Desconexión Programada AT — Paso 1 (Solicitud Formulario)</option>
                            <option value="gi_at_paso2">J2. Desconexión Programada AT — Paso 2 (Recepción Documentos)</option>
                            <option value="gi_pago_no_abonado">K1. Pago No Abonado (Supera 72 hrs)</option>
                            <option value="gi_pago_erroneo">K2. Pago Erróneo / Traslado de Pago</option>
                        </optgroup>
                        <optgroup label="2. Reclamos, Quejas y Recurso de Reposición">
                            <option value="reclamo_lectura">A. Reclamo por Cargos — Error / Estimación de Lectura</option>
                            <option value="reclamo_cnr">B. Reclamo por Cargos — Consumo No Registrado CNR (Causal 3347)</option>
                            <option value="queja_demora_empalme">C. Queja — Demora en Construcción / Instalación Empalme (Causal 3508)</option>
                            <option value="gi_recurso_reposicion">D. Recurso de Reposición (RR)</option>
                        </optgroup>
                        <optgroup label="3. Daño Individual (DI / Emergencia)">
                            <option value="di_estandar">A. Daño Individual Estándar (Emergencia General)</option>
                            <option value="di_ed_sin_asistencia">B. DI Electrodependiente — Sin Asistencia (Causal 184)</option>
                            <option value="di_ed_con_asistencia">C. DI Electrodependiente — Con Asistencia / Sin Autonomía (2 DI)</option>
                            <option value="di_ed_recarga">D. Asistencia y Recarga Combustible/Gas/Batería (Causal 3769)</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Caso de aplicación -->
                <div id="casoAplicacion" class="alert alert-secondary py-2 px-3 small mb-2"></div>

                <!-- Alerta normativa / Script obligatorio -->
                <div id="alertaScript" class="alert py-2 px-3 small mb-3 d-none" role="alert"></div>

                <!-- 2. Campos dinámicos según la glosa elegida -->
                <div id="camposDinamicos" class="row g-3 mb-3"></div>

                <hr class="my-3">

                <!-- 3. Vista previa de la glosa generada -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="glosaGenerada" class="form-label fw-semibold mb-0">Glosa resultante (MAYÚSCULAS)</label>
                        <span class="text-muted shortcut-hint">Atajos: <kbd>Enter</kbd> en último campo o <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></span>
                    </div>
                    <textarea id="glosaGenerada" class="form-control" rows="3"></textarea>
                </div>

                <!-- 4. Botones de acción -->
                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" id="btnLimpiar" class="btn btn-outline-secondary">
                        Limpiar datos
                    </button>
                    <button type="button" id="btnCopiar" class="btn btn-primary px-4">
                        Copiar glosa
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const OPCIONES_COBRO = [
            "SIN COBRO",
            "INFORMADO AT $ 34.000 + MATERIALES",
            "INFORMADO BT $19500+MATERIAL"
        ];

        const ALERTAS_CALIDAD = {
            financiacion: {
                clase: "alert-warning",
                texto: "⚠️ Script obligatorio: Confirmar monto del pie, número de cuotas y obtener respuesta afirmativa explícita del cliente. Recuerda adjuntar la validación del Registro Civil (CI) en OSF."
            },
            sec: {
                clase: "alert-primary",
                texto: "📢 Lectura obligatoria: Leer Carta de Confirmación de Reclamos SEC (Informar plazo máximo de 30 días corridos y derecho a acudir a la SEC)."
            }
        };

        function formatRut(rut) {
            let valor = rut.replace(/[^0-9kK]/g, '').toUpperCase();
            if (valor.length < 2) return valor;
            let cuerpo = valor.slice(0, -1);
            let dv = valor.slice(-1);
            return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
        }

        function normalizarTexto(texto) {
            return texto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        const GLOSAS = {
            gi_estandar: {
                caso: "GI Cerrada — Atención informativa general o consultas resueltas en línea durante la interacción.",
                campos: [
                    { id: "motivo", label: "Motivo del llamado", placeholder: "Ej: Consulta saldo y fecha de vencimiento", col: "col-12" },
                    { id: "firma", label: "Firma EAC", placeholder: "Ej: Juan Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID llamado", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `${v.motivo} // ${v.firma} // ${v.idLlamado}`
            },
            gi_lectura: {
                caso: "GI Cerrada (PELAP) — Registro de lectura aportada por el cliente antes de la facturación (indicar valor y fecha del aporte).",
                campos: [
                    { id: "lectura", label: "Valor de la Lectura (N°)", placeholder: "Ej: 15420", col: "col-md-6" },
                    { id: "fechaAporte", label: "Fecha de Toma/Aporte", placeholder: "Ej: 27/11/2026", col: "col-md-6" },
                    { id: "ejecutivo", label: "Nombre Ejecutivo", placeholder: "Ej: Juana Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID del llamado", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],

            },
            gi_financiacion: {
                caso: "Observación obligatoria de Financiación / Convenio de Deuda en OSF.",
                alerta: "financiacion",
                campos: [
                    { id: "nombreCliente", label: "Nombre del cliente", placeholder: "Ej: Juan Perez", col: "col-md-6" },
                    { id: "rut", label: "RUT cliente", placeholder: "Ej: 12.345.678-9", col: "col-md-6", isRut: true },
                    { id: "cuotasPie", label: "Cuotas y pie", placeholder: "Ej: 6 cuotas / $25.000 pie", col: "col-md-6" },
                    {
                        id: "subsidio",
                        label: "Condición de subsidio",
                        type: "select",
                        options: ["SIN SUBSIDIO", "CON SUBSIDIO"],
                        col: "col-md-3"
                    },
                    {
                        id: "convenioCovid",
                        label: "Convenio COVID",
                        type: "select",
                        options: ["SIN CONVENIO COVID", "CON CONVENIO COVID"],
                        col: "col-md-3"
                    },
                    { id: "ejecutivo", label: "Nombre quien ingresa", placeholder: "Ej: Juana Perez", col: "col-12", persist: true }
                ],
                generar: (v) => `${v.nombreCliente} ${v.rut} / ${v.cuotasPie} / ${v.subsidio} / ${v.convenioCovid} / ${v.ejecutivo}`

            gi_anulacion_fin: {

                alerta: "financiacion",
                campos: [
                    { id: "motivo", label: "Motivo de la anulación", placeholder: "Ej: Cliente solicita pago total al contado", col: "col-12" },
                    { id: "nombreCliente", label: "Nombre completo del cliente", placeholder: "Ej: Juan Perez", col: "col-md-6" },
                    { id: "rut", label: "RUT", placeholder: "Ej: 12.345.678-9", col: "col-md-6", isRut: true },
                    { id: "fono", label: "Fono de contacto (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-4" },
                    { id: "firma", label: "Firma / Ejecutivo", placeholder: "Ej: Juana Perez", col: "col-md-4", persist: true },
                    { id: "idLlamado", label: "ID del llamado", placeholder: "Ej: 987654321", col: "col-md-4" }
                ],
                generar: (v) => `Motivo: ${v.motivo} / Nombre del cliente: ${v.nombreCliente} / RUT: ${v.rut} / Fono: ${v.fono} / ${v.firma} / ID del llamado: ${v.idLlamado}`
            },
            gi_tramites_admin: {
                caso: "GI Abierta — Cambio de dirección, titular o trámites administrativos derivados.",
                campos: [
                    { id: "documentos", label: "Documentación adjunta", placeholder: "Ej: Certificado Número Municipal / RUT / Giro", col: "col-12" },
                    { id: "numeroGi", label: "N° GI Abierta", placeholder: "Ej: 45678912", col: "col-md-5" },
                    {

                        label: "Derivado a",
                        type: "select",
                        options: ["AUTOGESTIÓN WEB CHILQUINTA", "BACK OFFICE FILIALES"],
                        col: "col-md-7"
                    }
                ],
                generar: (v) => `Adjunta ${v.documentos} / GI ABIERTA N° ${v.numeroGi} / Derivado a ${v.destino}`
            },
            gi_regularizacion_retiro: {
                caso: "GI Abierta — Entrega de N° de gestión para normalizar suministro retirado y carga de documentos en web (www.chilquinta.cl > Cambios y trámites).",
                campos: [
                    { id: "rut", label: "RUT solicitante", placeholder: "Ej: 12.345.678-9", col: "col-md-4", isRut: true },
                    { id: "fono", label: "Fono (y anexo si aplica)", placeholder: "Ej: 912345678", col: "col-md-4" },
                    { id: "numeroGi", label: "N° GI Abierta", placeholder: "Ej: 45678912", col: "col-md-4" },
                    { id: "firma", label: "Firma Ejecutivo", placeholder: "Ej: Juan Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID llamado", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `SOLICITA REGULARIZACIÓN DE RETIRO DEFINITIVO / RUT: ${v.rut} / FONO: ${v.fono} / SE ENTREGA GI ABIERTA N° ${v.numeroGi} PARA CARGA WEB EN CAMBIOS Y TRÁMITES / ${v.firma} / ${v.idLlamado}`
            },
            gi_ed_nuevo: {
                caso: "GI Abierta — Inscripción provisoria de paciente electrodependiente sin registro previo en sistema.",
                campos: [
                    { id: "paciente", label: "Paciente (Nombre - RUT)", placeholder: "Ej: Juana Perez - 11.222.333-4", col: "col-md-6" },
                    { id: "tutor", label: "Tutor (Nombre - RUT)", placeholder: "Ej: Juan Perez - 15.666.777-8", col: "col-md-6" },
                    { id: "fono", label: "Fono (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-4" },
                    { id: "maquina", label: "Tipo de máquina", placeholder: "Ej: Concentrador de oxígeno", col: "col-md-4" },
                    { id: "autonomia", label: "Autonomía", placeholder: "Ej: 4 horas / Sin respaldo", col: "col-md-4" },
                    { id: "firma", label: "Firma Ejecutivo", placeholder: "Ej: Juana Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID llamada", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `REGISTRO ELECTRODEPENDIENTE / PACIENTE: ${v.paciente} // TUTOR: ${v.tutor} // ${v.fono} // SE LEE ANEXO 3 // ${v.maquina} // ${v.autonomia} // ${v.firma} // ${v.idLlamado}`
            },
            gi_ed_emergencia: {
                caso: "GI Abierta — Protocolo de emergencia y escalamiento a supervisión para cliente electrodependiente.",
                campos: [
                    { id: "paciente", label: "Nombre Paciente", placeholder: "Ej: Juan Perez", col: "col-md-6" },
                    { id: "autonomia", label: "Autonomía (Horas/Minutos)", placeholder: "Ej: 2 horas", col: "col-md-6" },
                    {
                        id: "registroOsf",
                        label: "Registro OSF",
                        type: "select",
                        options: ["SI", "NO"],
                        col: "col-md-4"
                    },
                    { id: "supervisor", label: "Notificado a Supervisor", placeholder: "Ej: Juana Perez", col: "col-md-4" },
                    { id: "numeroGi", label: "GI ABIERTA N°", placeholder: "Ej: 45678912", col: "col-md-4" },
                    { id: "recarga", label: "Recarga Combustible Filiales Centro (opcional)", placeholder: "Ej: No aplica / Solicita recarga", col: "col-12", optional: true }
                ],
                generar: (v) => `Paciente: ${v.paciente} / Autonomía: ${v.autonomia} / Registro OSF: ${v.registroOsf} / Notificado a Supervisor: ${v.supervisor} / GI ABIERTA N° ${v.numeroGi}${v.recarga ? ` / ${v.recarga}` : ""}`
            },
            gi_ed_fallecido: {
                caso: "GI Abierta — Registro de deceso de un paciente electrodependiente previamente empadronado.",
                campos: [
                    { id: "tutor", label: "Nombre y RUT tutor o quien llama", placeholder: "Ej: Juan Perez - 15.666.777-8", col: "col-md-6" },
                    { id: "paciente", label: "Nombre y RUT paciente fallecido", placeholder: "Ej: Juana Perez - 11.222.333-4", col: "col-md-6" },

                    { id: "idTpc", label: "ID o TPC", placeholder: "Ej: 987654321", col: "col-md-4" }
                ],
                generar: (v) => `Electrodependiente fallecido / Nombre y rut del tutor o de la persona que llama: ${v.tutor} / Nombre y rut del paciente fallecido: ${v.paciente} / Teléfono: ${v.fono} / ${v.firma} / ${v.idTpc}`
            },
            gi_ed_domicilio: {
                caso: "GI Abierta — Registro de cambio de domicilio de un paciente electrodependiente empadronado.",
                campos: [
                    { id: "contacto", label: "Nombre y RUT quien se contacta", placeholder: "Ej: Juana Perez - 15.666.777-8", col: "col-md-6" },
                    { id: "paciente", label: "Nombre y RUT Paciente", placeholder: "Ej: Juan Perez - 11.222.333-4", col: "col-md-6" },

            },
            gi_ed_alta: {
                caso: "GI Abierta — Registro de alta médica de un paciente electrodependiente empadronado.",
                campos: [
                    { id: "tutor", label: "Nombre y RUT tutor o quien llama", placeholder: "Ej: Juan Perez - 15.666.777-8", col: "col-md-6" },
                    { id: "paciente", label: "Nombre y RUT paciente", placeholder: "Ej: Juana Perez - 11.222.333-4", col: "col-md-6" },
                    { id: "fono", label: "Teléfono (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-4" },
                    { id: "firma", label: "Firma", placeholder: "Ej: Juan Perez", col: "col-md-4", persist: true },
                    { id: "idTpc", label: "ID o TPC", placeholder: "Ej: 987654321", col: "col-md-4" }
                ],
                generar: (v) => `Electrodependiente / Nombre y rut del tutor o de la persona que llama: ${v.tutor} / Nombre y rut del paciente: ${v.paciente} / Teléfono: ${v.fono} / Motivo: ya no es electrodependiente (dado de alta médica, etc) / ${v.firma} / ${v.idTpc}`
            },
            gi_at_paso1: {

                campos: [
                    { id: "datosCliente", label: "Datos Cliente", placeholder: "Ej: Empresa SpA / RUT / Fono / Correo", col: "col-12" },
                    { id: "firma", label: "Firma EAC", placeholder: "Ej: Juana Perez", col: "col-md-6", persist: true },

                ],
                generar: (v) => `BO/Solicita formulario DX / ${v.datosCliente} / ${v.firma} / ${v.idLlamado}`

                    { id: "datosCliente", label: "Datos Cliente", placeholder: "Ej: Empresa SpA / RUT / Fono / Correo", col: "col-12" },
                    { id: "firma", label: "Firma EAC", placeholder: "Ej: Juan Perez", col: "col-md-6", persist: true },

                generar: (v) => `Formulario desconexión AT programada / ${v.datosCliente} / ${v.firma} / ${v.idLlamado}`

            gi_pago_no_abonado: {

                    { id: "nombre", label: "Nombre", placeholder: "Ej: Juana Perez", col: "col-md-6" },

                alerta: "sec",
                campos: [

            gi_recurso_reposicion: {
                caso: "Recurso de Reposición (RR) — Solicitud en estado Atendido donde el cliente objeta la respuesta previa entregada.",
                alerta: "sec",
                campos: [
                    { id: "correo", label: "Correo de respuesta", placeholder: "Ej: cliente@correo.cl / SIN CORREO", col: "col-12" },
                    { id: "firma", label: "Firma Ejecutivo", placeholder: "Ej: Juana Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID llamado", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `CLIENTE NO ESTÁ DE ACUERDO CON LA RESPUESTA DE LA QUEJA, REQUIERE NUEVA REVISIÓN DE SUS ARTEFACTOS // CORREO ${v.correo} // SE LEE CARTA // ${v.firma} / ${v.idLlamado}`
            },
            di_estandar: {
                caso: "DI (Emergencia General) — Corte de suministro en domicilio, bajo voltaje, problema en empalme, líneas o postes.",
                campos: [
                    { id: "nombre", label: "Nombre", placeholder: "Ej: Juana Perez", col: "col-md-6" },
                    { id: "fono", label: "Fono (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-6" },
                    { id: "referencia", label: "Referencia domicilio", placeholder: "Ej: Frente a plaza, portón verde", col: "col-12" },
                    {
                        id: "posibleCobro",
                        label: "Información de cobro",
                        type: "select",
                        options: OPCIONES_COBRO,
                        col: "col-md-6"
                    },
                    { id: "firma", label: "Nombre / Firma Ejecutivo", placeholder: "Ej: Juan Perez", col: "col-md-3", persist: true },
                    { id: "idLlamado", label: "ID llamado", placeholder: "Ej: 987654321", col: "col-md-3" }
                ],
                generar: (v) => `${v.nombre} / ${v.fono} / ${v.referencia} / ${v.posibleCobro} / ${v.firma} / ${v.idLlamado}`
            },
            di_ed_sin_asistencia: {
                caso: "DI Causal 184 — Paciente electrodependiente sin energía eléctrica que NO requiere asistencia adicional inmediata.",
                campos: [
                    { id: "nombreLlama", label: "Nombre de quien llama", placeholder: "Ej: Juana Perez", col: "col-md-6" },
                    { id: "fono", label: "Fono (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-6" },
                    { id: "referencia", label: "Referencia", placeholder: "Ej: Casa esquina, reja negra", col: "col-md-6" },
                    { id: "autonomiaMaquina", label: "Autonomía y máquina", placeholder: "Ej: 6 hrs / Concentrador", col: "col-md-6" },
                    { id: "ejecutivo", label: "Nombre del Ejecutivo", placeholder: "Ej: Juan Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID del llamado", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `Electrodependiente: ${v.nombreLlama} / ${v.fono} / ${v.referencia} / ${v.autonomiaMaquina} / Se entregan medidas de seguridad / Atte. ${v.ejecutivo} y ${v.idLlamado}`
            },
            di_ed_con_asistencia: {
                caso: "Ingresar 2 DI (Causal 184 Sin energía + Causal 3769 Gestión Electrodependiente) — Paciente sin suministro y quedándose sin autonomía.",
                campos: [
                    { id: "nombreLlama", label: "Nombre de quien llama", placeholder: "Ej: Juana Perez", col: "col-md-6" },
                    { id: "fono", label: "Fono (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-6" },
                    { id: "referencia", label: "Referencia", placeholder: "Ej: Casa esquina, reja negra", col: "col-md-6" },
                    { id: "autonomiaMaquina", label: "Autonomía y máquina", placeholder: "Ej: Sin autonomía / Ventilador", col: "col-md-6" },
                    { id: "ejecutivo", label: "Nombre del Ejecutivo", placeholder: "Ej: Juan Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID del llamado", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `Electrodependiente: ${v.nombreLlama} / ${v.fono} / ${v.referencia} / ${v.autonomiaMaquina} / Se entregan medidas de seguridad / Atte. ${v.ejecutivo} y ${v.idLlamado}`
            },
            di_ed_recarga: {
                caso: "DI Causal 3769 — Entrega o recarga de combustible/gas para generadores o revisión de respaldos.",
                campos: [
                    { id: "nombreLlama", label: "Nombre de quien llama", placeholder: "Ej: Juana Perez", col: "col-md-6" },
                    { id: "fono", label: "Fono (y anexo si aplica)", placeholder: "Ej: 912345678 / Anexo 102", col: "col-md-6" },
                    { id: "estadoAutonomia", label: "Con / Sin autonomía", placeholder: "Ej: Sin autonomía", col: "col-md-5" },
                    { id: "detalleAsistencia", label: "Tipo asistencia (combustible, gas, batería)", placeholder: "Ej: recarga de combustible", col: "col-md-7" },
                    { id: "firma", label: "Firma", placeholder: "Ej: Juan Perez", col: "col-md-6", persist: true },
                    { id: "idLlamado", label: "ID de llamada", placeholder: "Ej: 987654321", col: "col-md-6" }
                ],
                generar: (v) => `Electro / ${v.nombreLlama} / Fono: ${v.fono} / ${v.estadoAutonomia}, cliente solicita asistencia (${v.detalleAsistencia}) / ${v.firma} / ${v.idLlamado}`
            }
        };

        const inputFiltro = document.getElementById("filtroGlosa");
        const btnLimpiarFiltro = document.getElementById("btnLimpiarFiltro");
        const selectTipo = document.getElementById("tipoGlosa");
        const divCaso = document.getElementById("casoAplicacion");
        const divAlertaScript = document.getElementById("alertaScript");
        const divCampos = document.getElementById("camposDinamicos");
        const txtGlosa = document.getElementById("glosaGenerada");
        const btnCopiar = document.getElementById("btnCopiar");
        const btnLimpiar = document.getElementById("btnLimpiar");

        function filtrarOpciones() {
            const termino = normalizarTexto(inputFiltro.value.trim());
            const optgroups = selectTipo.querySelectorAll("optgroup");
            let primeraVisible = null;
            let actualSigueVisible = false;

            optgroups.forEach((group) => {
                const opciones = group.querySelectorAll("option");
                let visiblesEnGrupo = 0;

                opciones.forEach((opt) => {
                    const config = GLOSAS[opt.value];
                    const textoBuscable = normalizarTexto(`${opt.textContent} ${config ? config.caso : ""}`);
                    const coincide = !termino || textoBuscable.includes(termino);

                    opt.hidden = !coincide;
                    if (coincide) {
                        visiblesEnGrupo++;
                        if (!primeraVisible) primeraVisible = opt;
                        if (opt.value === selectTipo.value) actualSigueVisible = true;
                    }
                });

                group.hidden = visiblesEnGrupo === 0;
            });

            if (!actualSigueVisible && primeraVisible) {
                selectTipo.value = primeraVisible.value;
                renderizarFormulario();
            }
        }

        function actualizarEstadoVisualInput(input, opcional) {
            if (opcional) {
                input.classList.remove("campo-pendiente", "campo-completo");
                return;
            }
            const tieneValor = input.value.trim().length > 0;
            input.classList.toggle("campo-completo", tieneValor);
            input.classList.toggle("campo-pendiente", !tieneValor);
        }

        function renderizarFormulario() {
            const config = GLOSAS[selectTipo.value];
            divCaso.textContent = config.caso;

            // Alerta visual de pauta de calidad
            if (config.alerta && ALERTAS_CALIDAD[config.alerta]) {
                const alerta = ALERTAS_CALIDAD[config.alerta];
                divAlertaScript.className = `alert ${alerta.clase} py-2 px-3 small mb-3 fw-medium`;
                divAlertaScript.textContent = alerta.texto;
            } else {
                divAlertaScript.className = "alert py-2 px-3 small mb-3 d-none";
                divAlertaScript.textContent = "";
            }

            divCampos.innerHTML = "";

            config.campos.forEach((campo, idx) => {
                const col = document.createElement("div");
                col.className = campo.col || "col-12";

                const label = document.createElement("label");
                label.className = "form-label small mb-1";
                label.htmlFor = `campo_${campo.id}`;
                label.textContent = campo.label;

                let control;

                if (campo.type === "select") {
                    control = document.createElement("select");
                    control.className = "form-select form-select-sm campo-completo";
                    campo.options.forEach((optText) => {
                        const opt = document.createElement("option");
                        opt.value = optText;
                        opt.textContent = optText;
                        control.appendChild(opt);
                    });
                    control.addEventListener("change", actualizarGlosa);
                } else {
                    control = document.createElement("input");
                    control.type = "text";
                    control.className = "form-control form-control-sm";
                    control.placeholder = campo.placeholder || "";

                    if (campo.persist) {
                        const guardado = localStorage.getItem(`osf_${campo.id}`);
                        if (guardado) control.value = guardado;
                    }

                    actualizarEstadoVisualInput(control, campo.optional);

                    control.addEventListener("input", () => {
                        if (campo.isRut) {
                            control.value = formatRut(control.value);
                        }
                        if (campo.persist) {
                            localStorage.setItem(`osf_${campo.id}`, control.value);
                        }
                        actualizarEstadoVisualInput(control, campo.optional);
                        actualizarGlosa();
                    });
                }

                // Copiar al presionar Enter en el último campo
                if (idx === config.campos.length - 1) {
                    control.addEventListener("keydown", (e) => {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            copiarGlosa();
                        }
                    });
                }

                control.id = `campo_${campo.id}`;
                control.dataset.campoId = campo.id;
                control.dataset.persist = campo.persist ? "true" : "false";
                control.dataset.optional = campo.optional ? "true" : "false";

                col.appendChild(label);
                col.appendChild(control);
                divCampos.appendChild(col);
            });

            actualizarGlosa();
        }

        function actualizarGlosa() {
            const config = GLOSAS[selectTipo.value];
            const valores = {};

            config.campos.forEach((campo) => {
                const control = document.getElementById(`campo_${campo.id}`);
                const val = control ? control.value.trim() : "";
                if (campo.optional) {
                    valores[campo.id] = val;
                } else {
                    valores[campo.id] = val || `[${campo.label}]`;
                }
            });

            txtGlosa.value = config.generar(valores).toLocaleUpperCase("es-CL");
        }

        async function copiarGlosa() {
            const texto = txtGlosa.value.toLocaleUpperCase("es-CL");
            txtGlosa.value = texto;
            try {
                await navigator.clipboard.writeText(texto);
            } catch {
                txtGlosa.select();
                document.execCommand("copy");
            }

            const textoOriginal = btnCopiar.textContent;
            btnCopiar.textContent = "¡Copiada!";
            btnCopiar.classList.replace("btn-primary", "btn-success");
            setTimeout(() => {
                btnCopiar.textContent = textoOriginal;
                btnCopiar.classList.replace("btn-success", "btn-primary");
            }, 1500);
        }

        txtGlosa.addEventListener("input", () => {
            const pos = txtGlosa.selectionStart;
            txtGlosa.value = txtGlosa.value.toLocaleUpperCase("es-CL");
            txtGlosa.setSelectionRange(pos, pos);
        });

        btnCopiar.addEventListener("click", copiarGlosa);

        btnLimpiar.addEventListener("click", () => {
            const controles = divCampos.querySelectorAll("input, select");
            let primerControlLimpio = null;

            controles.forEach((ctrl) => {
                if (ctrl.tagName === "SELECT") {
                    ctrl.selectedIndex = 0;
                } else if (ctrl.dataset.persist !== "true") {
                    ctrl.value = "";
                    actualizarEstadoVisualInput(ctrl, ctrl.dataset.optional === "true");
                    if (!primerControlLimpio) primerControlLimpio = ctrl;
                }
            });

            actualizarGlosa();
            if (primerControlLimpio) primerControlLimpio.focus();
        });

        inputFiltro.addEventListener("input", filtrarOpciones);
        inputFiltro.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                inputFiltro.value = "";
                filtrarOpciones();
            }
        });

        btnLimpiarFiltro.addEventListener("click", () => {
            inputFiltro.value = "";
            filtrarOpciones();
            inputFiltro.focus();
        });

        // Atajo global Ctrl + Shift + C para copiado rápido
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toUpperCase() === "C") {
                e.preventDefault();
                copiarGlosa();
            }
        });

        selectTipo.addEventListener("change", renderizarFormulario);
        renderizarFormulario();
    </script>
